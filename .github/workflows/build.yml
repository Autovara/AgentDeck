name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # We want to see every platform's result, not stop at the first red.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        # Tauri 2 on Linux compiles against WebKit2GTK 4.1, GTK3, and the
        # Ayatana AppIndicator headers. macOS links WKWebView from the system
        # frameworks and Windows links WebView2 (bundled by the build), so
        # neither needs an extra install. The same set is documented in
        # docs/install.md for end-users.
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            curl \
            file

      - name: Set up Rust (stable) + cache
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-tauri produces a lot of intermediate artifacts in
          # `src-tauri/target`; we want them cached too. The cache key
          # already includes the runner OS, so the three platforms do not
          # share entries.
          workspaces: ". -> target"

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck
