name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        # Tauri 2 on Linux compiles against WebKit2GTK 4.1, GTK3, and the
        # Ayatana AppIndicator headers. The same set is documented in
        # docs/install.md for end-users.
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            pkg-config \
            curl \
            file

      - name: Set up Rust (stable) + cache
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-tauri produces a lot of intermediate artifacts in
          # `src-tauri/target`; we want them cached too.
          workspaces: ". -> target"

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm typecheck
        run: pnpm typecheck
