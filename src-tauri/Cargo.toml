[package]
name = "agentdeck-app"
description = "AgentDeck Tauri application shell."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "agentdeck_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-os = { workspace = true }

agentdeck-adapter = { workspace = true }
agentdeck-adapter-aider = { workspace = true }
agentdeck-adapter-claude-code = { workspace = true }
agentdeck-adapter-codex = { workspace = true }
agentdeck-adapter-custom = { workspace = true }
agentdeck-attention = { workspace = true }
agentdeck-core = { workspace = true }
agentdeck-diagnostics = { workspace = true }
agentdeck-process = { workspace = true }
agentdeck-session = { workspace = true }
agentdeck-storage = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[features]
default = ["custom-protocol"]
# Custom-protocol is required for `tauri build` to use the embedded asset
# protocol (`tauri://`) instead of the dev server. `pnpm tauri dev` continues
# to work without this feature.
custom-protocol = ["tauri/custom-protocol"]
