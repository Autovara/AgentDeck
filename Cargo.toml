[workspace]
resolver = "2"
members = [
    "crates/agentdeck-core",
    "crates/agentdeck-harness",
    "crates/agentdeck-process",
    "crates/agentdeck-storage",
    "src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["AgentDeck contributors"]

[workspace.dependencies]
# Internal crates
agentdeck-core = { path = "crates/agentdeck-core" }
agentdeck-process = { path = "crates/agentdeck-process" }
agentdeck-storage = { path = "crates/agentdeck-storage" }

# General purpose
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
walkdir = "2.5"
uuid = { version = "1.23", features = ["v4", "serde"] }
dirs = "6.0"

# SQLite storage (bundled feature pins a known sqlite3 build; FFI features unlock
# JSON1/FTS5/etc which we will likely use as the monitor core grows).
rusqlite = { version = "0.39", features = ["bundled", "chrono", "serde_json", "uuid"] }
rusqlite_migration = "2.5"

# Cross-platform process scanning. Default features include networking + disks +
# components that we do not need; pin a minimal feature set instead.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Async runtime + logging (used by the Tauri shell and later the monitor core)
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tauri 2.x application framework
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2.3"
tauri-plugin-os = "2.3"

# Linux-only: DBus client for StatusNotifierWatcher probe in the tray detector
[workspace.dependencies.zbus]
version = "5.15"
default-features = false
features = ["tokio"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
