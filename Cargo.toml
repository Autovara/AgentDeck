[workspace]
resolver = "2"
members = [
    "crates/agentdeck-core",
    "crates/agentdeck-harness",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["AgentDeck contributors"]

[workspace.dependencies]
agentdeck-core = { path = "crates/agentdeck-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
